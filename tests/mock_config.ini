# 联调测试专用配置：指向 tests/mock_server.py（make mock-test 会自动启动）

[default]
model = mock-stream

[model mock-stream]
endpoint = http://127.0.0.1:18923/v1/chat/completions
api_key = env:MOCK_KEY
model = mock-model-a
context_size = 1000
temperature = 0.1
stream = true
timeout = 10

[model mock-block]
endpoint = http://127.0.0.1:18923/v1/chat/completions
api_key = mock-key
model = mock-model-b
stream = false
timeout = 10
